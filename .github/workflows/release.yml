name: Build & Release VoxType

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.version }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $clean = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "clean=$clean" >> $env:GITHUB_OUTPUT

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish VoxType.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=${{ steps.ver.outputs.clean }} `
            -o publish

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish\* -DestinationPath "dist\VoxType-Portable-${{ steps.ver.outputs.clean }}-win-x64.zip" -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          iscc /DAppVersion=${{ steps.ver.outputs.clean }} installer\VoxType.iss

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          $lines = Get-FileHash dist\*.exe, dist\*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $lines | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VoxType ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/VoxType-Setup-*.exe
            dist/VoxType-Portable-*.zip
            dist/SHA256SUMS.txt